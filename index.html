      <div style="padding: 2rem; font-family: sans-serif; max-width: 800px; margin: 0 auto;">
        <h1>Planificador de Carrera - Ingeniería en Informática - UNLaM</h1>
        <p>Herramienta interactiva para planificar tu carrera de Ingeniería en Informática en la Universidad Nacional de La Matanza.</p>
        <h2>Funcionalidades</h2>
        <p>Visualización del grafo de correlatividades con todas las materias de la carrera. Seguimiento de progreso académico: marcá materias como aprobadas o en curso. Análisis de distancia al título para priorizar qué materias cursar. Exportación e importación de tu progreso en formato JSON.</p>
        <h2>Materias por año</h2>
        <p>1° Año: Matemática Discreta, Álgebra y Geometría Analítica I, Análisis Matemático I, Física I, Programación Inicial, Programación Estructurada Básica, Introducción a los Sistemas de Información, Introducción a la Gestión de Requisitos, Sistemas de Numeración, Fundamentos de Sistemas Embebidos.</p>
        <p>Para usar esta aplicación necesitás tener JavaScript habilitado en tu navegador.</p>
        <p>Desarrollado por <a href="https://www.linkedin.com/in/franciscovignardel/">Francisco Vignard (Cisco)</a> - <a href="https://github.com/franvigna">GitHub</a></p>
      </div>
    </noscript>
    <script>
      (function () {

          if (t !== 'light' && t !== 'dark') {

          }
          document.documentElement.setAttribute('data-theme', t);
